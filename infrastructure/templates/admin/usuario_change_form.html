{% extends "admin/change_form.html" %}

{% block messages %}
    {{ block.super }}
{% endblock %}

{% block submit_buttons_bottom %}
    {{ block.super }}
    {% if original %}
        <div style="margin-top: 15px; padding: 10px; background: #f8d7da; border: 1px solid #f5c6cb; border-radius: 4px; display: inline-block;">
            <span style="margin-right: 10px; font-weight: bold; color: #721c24;">Zona de Ação:</span>
            
            <button type="button" 
                    onclick="if(confirm('Tem certeza que deseja resetar a senha deste usuário? Uma nova senha temporária será gerada.')) {
                        var form = document.querySelector('form');
                        form.action = '/admin/infrastructure/usuariomodel/{{ original.pk }}/resetar-senha/';
                        form.submit();
                    }"
                    style="background: #dc3545; color: white; padding: 6px 12px; border: none; border-radius: 4px; text-decoration: none; font-weight: bold; cursor: pointer;">
               🔄 Resetar Senha do Usuário
            </button>
        </div>
    {% endif %}
{% endblock %}
