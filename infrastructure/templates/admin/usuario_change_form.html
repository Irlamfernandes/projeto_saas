{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
    {{ block.super }}
    {% if original and perms.usuarios.change_usuariomodel %}
        <div style="margin-top: 15px; padding: 10px; background: #f8d7da; border: 1px solid #f5c6cb; border-radius: 4px; display: inline-block;">
            <span style="margin-right: 10px; font-weight: bold; color: #721c24;">Zona de Ação:</span>
            
            <form action="{% url 'admin:usuario_resetar_senha' original.pk %}" method="POST" style="display: inline;" onsubmit="return confirm('Tem certeza que deseja resetar a senha deste usuário? Uma nova senha temporária será gerada.');">
                {% csrf_token %}
                <button type="submit" 
                        style="background: #dc3545; color: white; padding: 6px 12px; border: none; border-radius: 4px; text-decoration: none; font-weight: bold; cursor: pointer;">
                   🔄 Resetar Senha do Usuário
                </button>
            </form>
        </div>
    {% endif %}
{% endblock %}
