# Mesmo nome do projeto criado no SonarQube local (http://localhost:9000/dashboard?id=Projeto-Saas)
sonar.projectKey=Projeto-Saas
sonar.host.url=http://localhost:9000
sonar.projectName=Projeto SaaS
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# 1. Onde está o código-fonte principal de produção (excluindo explicitamente a pasta de testes)
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/venv/**,**/staticfiles/**,**/media/**,db.sqlite3,manage.py,**/migrations/**,coverage/**,htmlcov/**,**/__pycache__/**,static/tests/**,**/tests/**,Dockerfile,config/settings_test.py,static/vendor/**

# 2. Onde estão os arquivos de teste (o Sonar vai ler os testes aqui, sem conflito com o sources acima)
sonar.tests=static/tests,interfaces/tests,infrastructure/tests,application/tests,config/tests

# 3. Configurações de Cobertura
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Arquivos sem teste por natureza (ponto de entrada do servidor, configuração do Tailwind, service worker vazio):
# ficam fora da conta de cobertura, como já ficam no .coveragerc
sonar.coverage.exclusions=config/wsgi.py,config/asgi.py,tailwind.config.js,interfaces/static/sw.js
