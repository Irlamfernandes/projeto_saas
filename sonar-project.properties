sonar.projectKey=Projeto-SaaS
sonar.projectName=Projeto SaaS
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# 1. Onde está o código-fonte principal (todo o projeto)
sonar.sources=.

# 2. Onde estão os arquivos de teste (isso diz ao Sonar: "estes arquivos são testes, não código fonte principal")
sonar.tests=static/tests
# (Se você tiver testes em Python em outra pasta, ex: interfaces/tests, adicione separados por vírgula)

# 3. O que deve ficar COMPLETAMENTE de fora da análise
sonar.exclusions=**/node_modules/**,**/venv/**,**/staticfiles/**,**/media/**,db.sqlite3,manage.py,**/migrations/**,coverage/**,htmlcov/**,**/__pycache__/**

# 4. Configurações de Cobertura (Para o Sonar puxar a % de coverage)
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info