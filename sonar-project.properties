sonar.projectKey=Projeto-SaaS
sonar.projectName=Projeto SaaS
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# 1. Onde está o código-fonte principal de produção (excluindo explicitamente a pasta de testes)
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/venv/**,**/staticfiles/**,**/media/**,db.sqlite3,manage.py,**/migrations/**,coverage/**,htmlcov/**,**/__pycache/**,static/tests/**,**/tests/**,Dockerfile

# 2. Onde estão os arquivos de teste (o Sonar vai ler os testes aqui, sem conflito com o sources acima)
sonar.tests=static/tests,interfaces/tests

# 3. Configurações de Cobertura
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info