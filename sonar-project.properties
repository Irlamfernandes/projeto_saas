sonar.projectKey=Projeto-SaaS
sonar.projectName=Projeto SaaS
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# 1. Onde está o código-fonte principal
sonar.sources=.

# 2. O que deve ficar COMPLETAMENTE de fora da análise 
# (Adicionei as pastas de cache, coverage e htmlcov para o Sonar não analisar o HTML do relatório)
sonar.exclusions=**/node_modules/**,**/venv/**,**/staticfiles/**,**/media/**,db.sqlite3,manage.py,**/migrations/**,coverage/**,htmlcov/**,**/__pycache__/**

# 3. Onde estão os testes do seu projeto 
# Isso avisa ao Sonar que esses arquivos são de teste, logo ele não vai cobrar regras de "código de produção" neles.
sonar.tests=static/tests
# (Se você tiver testes em Python, adicione a pasta deles acima separando por vírgula. Ex: static/tests,app/tests)

# 4. === CONFIGURAÇÕES DE COBERTURA === (ESSENCIAL PARA O SEU CASO)
# Aponta para o XML gerado pelo pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Aponta para o relatório gerado pelo Jest (--coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info