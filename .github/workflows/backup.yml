# Bate na porta do sistema de hora em hora. Quem decide se é hora de fazer o backup é a configuração do admin
# (Sistema → Backups → Configurar): ligado/desligado, a cada quantas horas, dias ou meses.
# Precisa de dois segredos no GitHub (Settings → Secrets and variables → Actions):
#   SITE_URL      endereço do sistema, ex.: https://projeto-saas-44z9.onrender.com
#   BACKUP_TOKEN  o mesmo valor da variável BACKUP_TOKEN no Render
# Para bater mais vezes (ex.: a cada 30 min), troque o cron por "*/30 * * * *".
name: Backup

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  chamar:
    runs-on: ubuntu-24.04
    steps:
      - name: Pedir o backup (o Render grátis pode levar ~1 min para acordar)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$BACKUP_TOKEN" ]; then
            echo "::warning::Defina os segredos SITE_URL e BACKUP_TOKEN para ligar o backup agendado."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 30 \
            -X POST -H "Authorization: Bearer $BACKUP_TOKEN" "$SITE_URL/interno/backup/"
