# Dependabot: PRs de versão nova PAUSADOS (open-pull-requests-limit: 0). Quem avisa das versões novas é a
# verificação semanal (.github/workflows/atualizacoes.yml), que testa cada uma e publica o resultado numa issue.
# Se religar (troque os 0 por 5), os PRs vão para a homologacao e só depois de 7 dias da versão publicada
# (cooldown: dá tempo de a versão com problema ser retirada antes de chegar aqui).
# Alertas e correções de segurança não dependem deste arquivo: ficam em Settings > Code security no GitHub.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: homologacao
    cooldown:
      default-days: 7
    groups:
      python:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Versão principal do Django é migração planejada (como a 5.2 -> 6.1), não PR automático.
      - dependency-name: django
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: homologacao
    cooldown:
      default-days: 7
    groups:
      javascript:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 muda configuração e build: migração é um trabalho à parte.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    target-branch: homologacao
    cooldown:
      default-days: 7
