# Dependabot: PRs de versão nova PAUSADOS enquanto o sistema recebe melhorias (open-pull-requests-limit: 0).
# As atualizações são feitas à mão, testadas, num PR só. Para religar, troque os 0 por 5.
# Alertas e correções de segurança não dependem deste arquivo: ficam em Settings > Code security no GitHub.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Versão principal do Django é migração planejada (como a 5.2 -> 6.1), não PR automático.
      - dependency-name: django
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      javascript:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 muda configuração e build: migração é um trabalho à parte.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
