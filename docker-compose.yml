version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: saas_postgres
    environment:
      POSTGRES_DB: db_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Irlam170319211297
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: saas_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: