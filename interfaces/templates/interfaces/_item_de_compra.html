{% load formatacao %}{% comment %}
Uma linha de produto da compra. Repetida pelo static/js/gastos.js a partir do <template> ("Outro produto").
O custo vem preenchido com o preço de custo atual do produto escolhido.
{% endcomment %}
<fieldset class="grid grid-cols-[1fr_auto] gap-2 rounded-controle border border-linha p-3" data-item-compra>
    <legend class="sr-only">Produto da compra</legend>
    <label class="campo col-span-2"><span class="text-xs font-semibold text-tinta-suave">Produto</span>
    <select name="item_produto" class="entrada" data-produto-compra>
        <option value="">Escolha o produto</option>
        {% for produto in produtos %}<option value="{{ produto.id }}" data-custo="{{ produto.preco_custo|numero_simples }}" data-sigla="{{ produto.sigla }}" data-casas="{{ produto.casas_decimais }}">{{ produto.nome }}</option>{% endfor %}
    </select></label>
    <div class="grid grid-cols-2 gap-2">
        <label class="campo"><span class="text-xs font-semibold text-tinta-suave">Quantidade</span>
            <span class="entrada-grupo"><input type="number" name="item_quantidade" step="any" min="0.001" inputmode="decimal" class="tabular-nums"><span class="afixo-fim" data-sigla-compra>un.</span></span></label>
        <label class="campo"><span class="text-xs font-semibold text-tinta-suave">Custo de cada</span>
            <span class="entrada-grupo"><span class="afixo">R$</span><input type="number" name="item_custo" step="0.01" min="0" inputmode="decimal" class="tabular-nums"></span></label>
    </div>
    <button type="button" class="btn-fantasma btn-pequeno px-2 text-critico-texto self-center" data-remover-item-compra><svg class="ico ico-sm"><use href="#i-lixeira"/></svg><span class="sr-only">Tirar este produto</span></button>
</fieldset>
