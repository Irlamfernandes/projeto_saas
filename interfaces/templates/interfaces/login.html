<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-96">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Entrar no SaaS</h1>
        
        <form method="POST" autocomplete="on">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
                <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm" role="alert">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="mb-4">
                <label for="{{ form.username.id_for_label }}" class="block text-gray-700 text-sm font-bold mb-2">Usuário</label>
                <div class="[&>input]:w-full [&>input]:px-3 [&>input]:py-2 [&>input]:border [&>input]:border-gray-300 [&>input]:rounded-lg [&>input]:text-sm [&>input]:focus:outline-none [&>input]:focus:ring-2 [&>input]:focus:ring-blue-500">
                    {{ form.username }}
                </div>
                {% if form.username.errors %}
                    <div class="mt-1 text-xs text-red-600" role="alert">
                        {{ form.username.errors }}
                    </div>
                {% endif %}
            </div>

            <div class="mb-6">
                <label for="{{ form.password.id_for_label }}" class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
                <div class="[&>input]:w-full [&>input]:px-3 [&>input]:py-2 [&>input]:border [&>input]:border-gray-300 [&>input]:rounded-lg [&>input]:text-sm [&>input]:focus:outline-none [&>input]:focus:ring-2 [&>input]:focus:ring-blue-500">
                    {{ form.password }}
                </div>
                {% if form.password.errors %}
                    <div class="mt-1 text-xs text-red-600" role="alert">
                        {{ form.password.errors }}
                    </div>
                {% endif %}
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200 cursor-pointer">
                Entrar
            </button>
        </form>
    </div>
</body>
</html>
