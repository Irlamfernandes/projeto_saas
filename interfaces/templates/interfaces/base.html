<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SaaS de Gestão{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar / Menu Lateral -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col justify-between hidden md:flex">
            <div>
                <!-- Logo / Título Dinâmico -->
                <div class="px-6 py-5 border-b border-gray-800">
                    <a href="{% url 'dashboard' %}" class="text-xl font-bold tracking-wider text-indigo-400">
                        {{ request.user.loja.nome_loja|default:"Minha Loja" }}
                    </a>
                </div>

                <!-- Links de Navegação -->
                <nav class="mt-6 px-4 space-y-2">
                    <a href="{% url 'dashboard' %}" class="flex items-center px-4 py-2.5 {% if request.resolver_match.url_name == 'dashboard' %}bg-gray-800 text-white{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %} rounded-lg font-medium transition">
                        📊 Visão Geral
                    </a>
                    <!-- Links futuros que vamos implementar -->
                    <a href="{% url 'produtos' %}" class="flex items-center px-4 py-2.5 {% if request.resolver_match.url_name == 'produtos' %}bg-gray-800 text-white{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %} rounded-lg transition font-medium">
                        📦 Produtos
                    </a>
                    <a href="{% url 'clientes' %}" class="flex items-center px-4 py-2.5 {% if request.resolver_match.url_name == 'clientes' %}bg-gray-800 text-white{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %} rounded-lg transition font-medium">
                        👥 Clientes
                    </a>
                    <a href="#" class="flex items-center px-4 py-2.5 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition font-medium">
                        🛒 Vendas
                    </a>
                    <a href="#" class="flex items-center px-4 py-2.5 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition font-medium">
                        📜 Histórico
                    </a>
                </nav>
            </div>

            <!-- Rodapé da Sidebar (Logout) -->
            <div class="p-4 border-t border-gray-800">
                <form action="{% url 'logout' %}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="w-full flex items-center justify-center bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition font-medium">
                        Sair da Conta
                    </button>
                </form>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- Topbar / Cabeçalho -->
            <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">{% block header_title %}Painel{% endblock %}</h2>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium text-gray-600">Olá, <strong class="text-gray-900">{{ request.user.username }}</strong></span>
                </div>
            </header>

            <!-- Área de Conteúdo Dinâmico -->
            <main class="p-8">
                {% block content %}
                {% endblock %}
            </main>

        </div>

    </div>

</body>
</html>
