{% extends 'interfaces/base.html' %}

{% block title %}Editar Venda #{{ venda.id }}{% endblock %}
{% block header_title %}Editar Venda #{{ venda.id }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-200">
    <h3 class="text-lg font-bold text-gray-800 mb-4">Modificar Dados da Venda</h3>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-4">
            <label for="id_cliente_venda" class="block text-gray-700 text-sm font-semibold mb-1">Cliente</label>
            <select id="id_cliente_venda" name="cliente" required class="w-full px-3 py-2 border rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">Selecione o cliente...</option>
                {% for cliente in clientes %}
                    <option value="{{ cliente.id }}" {% if venda.cliente and venda.cliente.id == cliente.id %}selected{% endif %}>
                        {{ cliente.nome }}
                    </option>
                {% endfor %}
            </select>
        </div>

            <div class="mb-4">
                <label for="id_produto_venda" class="block text-gray-700 text-sm font-semibold mb-1">Produto (Nome ou Código Interno)</label>
                <input type="text" id="id_produto_venda" name="produto" list="lista-produtos" required value="{% if item_atual.produto.codigo_interno %}{{ item_atual.produto.codigo_interno }}{% else %}{{ item_atual.produto.nome }}{% endif %}" placeholder="Digite o nome ou código..." class="w-full px-3 py-2 border rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                
                <datalist id="lista-produtos">
                    {% for prod in produtos %}
                        <option value="{% if prod.codigo_interno %}{{ prod.codigo_interno }}{% else %}{{ prod.nome }}{% endif %}">
                            {{ prod.nome }} (Cód: {{ prod.codigo_interno|default:"N/D" }}) - R$ {{ prod.preco_venda|default:0|floatformat:2 }} [Estoque: {{ prod.quantidade_estoque }}]
                        </option>
                    {% endfor %}
                </datalist>
            </div>

        <div class="mb-4">
            <label for="id_quantidade_venda" class="block text-gray-700 text-sm font-semibold mb-1">Quantidade</label>
            <input type="number" id="id_quantidade_venda" name="quantidade" value="{{ item_atual.quantidade|default:1 }}" min="1" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>

        <div class="mb-6">
            <label for="id_observacoes_venda" class="block text-gray-700 text-sm font-semibold mb-1">Observações</label>
            <textarea id="id_observacoes_venda" name="observacoes" rows="2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">{{ venda.observacoes|default:'' }}</textarea>
        </div>

        <div class="flex gap-4">
            <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition text-sm cursor-pointer">
                Salvar Alterações
            </button>
            <a href="{% url 'vendas' %}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg text-sm text-center flex items-center justify-center">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
