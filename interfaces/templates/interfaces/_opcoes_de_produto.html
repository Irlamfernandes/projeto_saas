{% load formatacao %}{% comment %}
<option>s de produto para compras e perdas. Produto com variações aparece como um grupo, uma opção por variação
(valor "id do produto:id da variação"); sem variações, valor só com o id. Parâmetro: com_estoque (mostra a quantidade).
{% endcomment %}{% for produto in produtos %}{% with variacoes=produto.variacoes.all %}{% if variacoes %}<optgroup label="{{ produto.nome }}">{% for variacao in variacoes %}<option value="{{ produto.id }}:{{ variacao.id }}" data-custo="{{ produto.preco_custo|numero_simples }}" data-sigla="{{ produto.sigla }}" data-casas="{{ produto.casas_decimais }}">{{ produto.nome }} ({{ variacao.nome }}){% if com_estoque and produto.controla_estoque %} · {{ variacao.quantidade_estoque|quantidade:produto.unidade }}{% endif %}</option>{% endfor %}</optgroup>{% else %}<option value="{{ produto.id }}" data-custo="{{ produto.preco_custo|numero_simples }}" data-sigla="{{ produto.sigla }}" data-casas="{{ produto.casas_decimais }}">{{ produto.nome }}{% if com_estoque and produto.controla_estoque %} · {{ produto.quantidade_estoque|quantidade:produto.unidade }}{% endif %}</option>{% endif %}{% endwith %}{% endfor %}
