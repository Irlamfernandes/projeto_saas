{% comment %}Escolha da forma de pagamento em botões. Parâmetros: formas (choices), selecionada, legenda.{% endcomment %}
<fieldset class="campo" data-forma-pagamento>
    <legend class="rotulo mb-1.5">{{ legenda|default:"Como pagou" }}</legend>
    <div class="flex flex-wrap gap-2">
        {% for valor, rotulo in formas %}
        <label class="opcao">
            <input type="radio" name="forma_pagamento" value="{{ valor }}" class="sr-only peer" {% if valor == selecionada %}checked{% endif %}>
            <span class="opcao-rotulo">{{ rotulo }}</span>
        </label>
        {% endfor %}
    </div>
</fieldset>
