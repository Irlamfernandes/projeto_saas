{% extends 'interfaces/base.html' %}

{% block header_title %}Assinatura e Planos{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-4">
    <p class="text-gray-600 mb-8">Escolha o plano ideal para manter a sua loja ativa e gerenciar suas vendas sem interrupções.</p>
    
    <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        {% csrf_token %}
        {% for plano in planos %}
            <label class="border border-gray-200 rounded-xl p-6 cursor-pointer hover:border-indigo-600 hover:shadow-md transition bg-white flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-lg font-semibold text-gray-900">{{ plano.nome }}</span>
                        <input type="radio" name="plano" value="{{ plano.id }}" class="text-indigo-600 focus:ring-indigo-500 h-4 w-4" required>
                    </div>
                    <p class="text-3xl font-extrabold text-indigo-600 mb-2">R$ {{ plano.valor }}</p>
                    <p class="text-sm text-gray-500">{{ plano.detalhe }}</p>
                </div>
            </label>
        {% endfor %}
        
        <div class="md:col-span-2 mt-4">
            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-indigo-700 transition cursor-pointer">
                Gerar Pix de Pagamento
            </button>
        </div>
    </form>
</div>
{% endblock %}
