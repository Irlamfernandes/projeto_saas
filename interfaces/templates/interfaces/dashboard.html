<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md text-center">
        <h1 class="text-3xl font-bold mb-4 text-gray-800">Bem-vindo ao Dashboard!</h1>
        <p class="text-gray-600 mb-6">Você fez login com sucesso no sistema.</p>
        
        <form action="{% url 'logout' %}" method="POST">
            {% csrf_token %}
            <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition w-full">
                Sair
            </button>
        </form>
    </div>
</body>
</html>
