services:
  - type: web
    name: projeto-saas-loja
    env: python
    region: ohio
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --threads 4"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Processos do Gunicorn (lido automaticamente por ele). 2 cabe nos 512 MB do plano free.
      # Com --threads 4, cada processo atende 4 pessoas ao mesmo tempo: um PDF ou o Mercado Pago não trava os outros.
      - key: WEB_CONCURRENCY
        value: 2
      # Backup: gere valores longos e aleatórios. Guarde a BACKUP_CHAVE também fora do Render: sem ela, nenhum backup abre.
      - key: BACKUP_CHAVE
        sync: false
      - key: BACKUP_TOKEN
        sync: false
